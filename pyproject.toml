[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "foundry"
version = "0.1.0"
description = "Foundry CLI: idea to repo through a human-checkpointed planning pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.15",
    "aiosqlite>=0.20",
    "tomli-w>=1.1",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[project.scripts]
foundry = "foundry.cli:app"

[tool.setuptools.packages.find]
include = ["foundry*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
